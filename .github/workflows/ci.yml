# Vérifie chaque PR (et chaque push sur main) : installation propre, build de production, tests.
# Une PR qui casse l'installation ou le build échoue ici, avant d'arriver jusqu'à Netlify.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Build de production
        run: npm run build

      - name: Tests
        run: npm test -- --watch=false
